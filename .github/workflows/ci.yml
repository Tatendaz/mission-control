name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine parses
        run: |
          node --check sweep.js
          node --check server.js
          node --check scribe.js

      - name: Board template script parses
        # the bulk of the UI lives in one inline <script>; check it too
        run: |
          node -e '
            const fs = require("fs"), vm = require("vm");
            const html = fs.readFileSync("board.template.html", "utf8");
            const m = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!m.length) { console.error("no inline script found"); process.exit(1); }
            for (const [i, s] of m.entries()) new vm.Script(s[1], { filename: `template-script-${i}.js` });
            console.log(`${m.length} inline script block(s) parse`);
          '

      - name: Packaging scripts parse
        run: |
          sh -n app/build-app.sh
          python3 -m py_compile make-icon.py
      - name: Template markers survive a dry sweep
        # A fresh install is config.example + template; the sweeper must find
        # every marker region and abort cleanly with no repos, gh, or sessions.
        run: |
          cp config.example.json config.json
          cp board.template.html board.html
          node sweep.js --dry
          test ! -f .cache.json   # --dry must write nothing
